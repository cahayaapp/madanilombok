<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#2878ff">
  <title>MadaniApp · Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <link rel="stylesheet" href="../assets/css/cahaya-clone.css">
</head>
<body class="app-body portal-body">
  <div class="app-shell portal-shell">
    <aside class="sidebar portal-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">M</div>
        <div><strong>MadaniApp</strong><small>Pondok Pesantren Al-Madani</small></div>
      </div>
      <div style="padding:0 18px 12px">
        <div style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:linear-gradient(135deg,#eef5ff,#edfaff);border:1px solid #d9e9ff;border-radius:15px">
          <span style="width:10px;height:10px;background:#29c58d;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(41,197,141,.13)"></span>
          <div><strong style="display:block;font-size:.72rem;color:#152347">Al-Madani Integrated System</strong><span style="font-size:.61rem;color:#71809e;font-weight:700">Akademik · Asrama · Wali · Keuangan</span></div>
        </div>
      </div>
      <nav id="navMenu" class="nav-menu"></nav>
      <div class="sidebar-footer portal-user">
        <div style="min-width:0;flex:1"><strong id="userName">Pengguna</strong><select id="rolePicker" class="role-picker" aria-label="Role aktif"></select></div>
        <button id="logoutButton" class="link-button">Keluar</button>
      </div>
    </aside>
    <main class="main-area main-content">
      <header class="topbar portal-topbar top-nav">
        <button id="menuButton" class="icon-button mobile-only">☰</button>
        <div style="min-width:0"><p class="eyebrow">Pondok Pesantren Al-Madani</p><h1 id="pageTitle">Beranda</h1></div>
        <div class="top-actions">
          <a id="adminLink" class="btn btn-secondary hidden" href="../admin/index.html">Admin Master Data</a>
          <div class="year-chip"><span>Tahun Aktif</span><strong id="activeYearLabel">Memuat…</strong></div>
        </div>
      </header>
      <section id="content" class="content-area portal-content"><div class="loading-card">Memuat MadaniApp…</div></section>
    </main>
  </div>
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Navigasi utama">
    <button type="button" data-shell-nav="schedule"><span class="mb-icon">◷</span><span>Jadwal</span></button>
    <button type="button" data-shell-nav="kpi"><span class="mb-icon">▥</span><span>KPI</span></button>
    <button type="button" class="mb-home active" data-shell-nav="home"><span class="mb-icon">⌂</span><span>Beranda</span></button>
    <button type="button" data-shell-nav="messages"><span class="mb-icon">✉</span><span>Pesan</span></button>
    <button type="button" data-shell-nav="more"><span class="mb-icon">☷</span><span>Lainnya</span></button>
  </nav>
  <div id="toastHost" class="toast-host"></div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
