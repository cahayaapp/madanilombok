<!DOCTYPE html><html lang="id"><head>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perizinan Santri - Pimpinan</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17243b;--muted:#718096;--line:#e4eaf2;--blue:#3478e5;--cyan:#0ea5c6;--green:#16a56a;--amber:#f3a51f;--red:#e84b5e;--violet:#8358dc;--shadow:0 14px 38px rgba(27,51,90,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f4f8ff,#fbf7ff 48%,#f3fbf8);color:var(--ink);font-family:Nunito,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:18px}.hero{padding:23px;border-radius:26px;background:linear-gradient(120deg,#173761,#2c69ba 48%,#15a2b8);color:#fff;box-shadow:0 18px 48px rgba(33,92,159,.22);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-170px;background:rgba(255,255,255,.11)}.hero h1{position:relative;margin:0;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.04em}.hero p{position:relative;margin:7px 0 0;color:#dcecff;font-size:.82rem;font-weight:700;line-height:1.55}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.field,.filter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;color:#405774;font-size:.74rem;font-weight:800;outline:0}.btn{border:0;border-radius:12px;padding:10px 14px;font-size:.72rem;font-weight:900;cursor:pointer;background:#eaf1fb;color:#356394}.btn.primary{background:linear-gradient(135deg,#2f72da,#24a0c0);color:#fff}.btn.green{background:#16a56a;color:#fff}.btn.red{background:#e84b5e;color:#fff}.btn.amber{background:#f3a51f;color:#fff}.btn:disabled{opacity:.55;cursor:wait}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.metric small{display:block;color:#8492a6;font-size:.58rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.metric b{display:block;margin-top:6px;font-size:1.25rem}.metric span{display:block;margin-top:3px;color:#7c8ba0;font-size:.62rem;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;font-size:.91rem}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:.66rem;font-weight:700}.panel-body{padding:15px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,#fff,#fbfdff)}.card-head{display:flex;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:.79rem}.meta{color:#7d8da3;font-size:.61rem;font-weight:750;line-height:1.55}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:.53rem;font-weight:950;background:#eef4fb;color:#53708e}.badge.wait{background:#fff5db;color:#a56c00}.badge.ok{background:#e9f9f1;color:#168456}.badge.no{background:#fff0f2;color:#c93d50}.badge.done{background:#eeeaff;color:#6a4bc0}.detail{margin-top:10px;padding-top:10px;border-top:1px dashed #dfe6ef;display:grid;gap:5px;font-size:.64rem;color:#465d79;line-height:1.55}.detail b{color:#263d5a}.empty{text-align:center;padding:34px 15px;color:#8090a5;font-size:.72rem;font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:.62rem;font-weight:950;color:#465d78}.form-control{width:100%;border:1px solid #dce4ee;border-radius:12px;padding:11px 12px;background:#fbfdff;color:#263d58;font-size:.72rem;font-weight:750;outline:0}.form-control:focus{border-color:#69a6ed;box-shadow:0 0 0 3px rgba(65,132,224,.12)}textarea.form-control{min-height:96px;resize:vertical}.notice{padding:11px 12px;border-radius:12px;background:#eff7ff;color:#3e638a;font-size:.65rem;font-weight:750;line-height:1.55;margin-bottom:12px}.notice.warn{background:#fff7df;color:#8d650c}.file-preview{display:none;margin-top:8px;border-radius:12px;max-width:220px;max-height:180px;object-fit:cover;border:1px solid var(--line)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{padding:11px 10px;text-align:left;background:#f2f6fb;color:#62748b;font-size:.55rem;text-transform:uppercase;letter-spacing:.04em}.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;font-size:.62rem;color:#405772;vertical-align:top}.table td b{color:#243b57}.modal{display:none;position:fixed;inset:0;z-index:9999;padding:18px;background:rgba(13,26,47,.58);align-items:center;justify-content:center}.modal.open{display:flex}.modal-card{width:min(780px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:.86rem}.modal-body{padding:15px}.close{width:34px;height:34px;border:0;border-radius:10px;background:#edf2f8;color:#5b6d83;font-weight:950}.doc-view{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}.loading{padding:30px;text-align:center;color:#74869d;font-size:.72rem;font-weight:850}@media(max-width:780px){.app{padding:10px}.summary{grid-template-columns:repeat(2,1fr)}.cards,.form-grid{grid-template-columns:1fr}.hero{padding:18px}.panel-body{padding:12px}}</style></head><body><main class="app"><section class="hero"><h1>🛡️ Pusat Perizinan Santri</h1><p>Review pengajuan wali dan UKS, berikan keputusan, pantau waktu kembali, dan baca seluruh riwayat perizinan.</p></section><div class="toolbar"><select class="filter" id="statusFilter" onchange="render()"><option value="">Semua Status</option><option>MENUNGGU_PIMPINAN</option><option>DISETUJUI</option><option>DITOLAK</option><option>SELESAI</option></select><select class="filter" id="sourceFilter" onchange="render()"><option value="">Semua Pengaju</option><option value="WALI">Wali Santri</option><option value="UKS">UKS</option></select><input class="field" id="search" placeholder="Cari santri, jenis izin, tujuan..." oninput="render()"><button class="btn primary" onclick="loadData()">↻ Segarkan</button></div><section class="summary" id="summary"></section><section class="panel"><header class="panel-head"><div><h2>Daftar dan Riwayat Perizinan</h2><p>Pengajuan terbaru ditampilkan paling atas.</p></div></header><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>Pengajuan</th><th>Santri</th><th>Jenis / Tujuan</th><th>Rencana</th><th>Status</th><th>Tindakan</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section></main><div class="modal" id="modal"><article class="modal-card"><header class="modal-head"><h3 id="modalTitle">Review Perizinan</h3><button class="close" onclick="closeModal()">×</button></header><div class="modal-body" id="modalBody"></div></article></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,update,query,orderByChild,limitToLast}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';const config = window.CAHAYA_CONFIG.firebase;const db=getDatabase(initializeApp(config));let permits=[],selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateId=v=>{if(!v)return'-';const d=new Date(String(v).length===10?v+'T00:00:00':v);return isNaN(d)?v:new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:String(v).includes('T')?'short':undefined}).format(d)};const user=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch(e){return{}}})();const userName=()=>user.label||user.nama||user.username||'Pimpinan';const badge=s=>s==='DISETUJUI'?'ok':s==='DITOLAK'?'no':s==='SELESAI'?'done':'wait';function filtered(){const st=document.getElementById('statusFilter').value,src=document.getElementById('sourceFilter').value,q=document.getElementById('search').value.toLowerCase();return permits.filter(p=>(!st||p.status===st)&&(!src||p.sumberPengajuan===src)&&(!q||`${p.namaSantri} ${p.jenisIzin} ${p.tujuan}`.toLowerCase().includes(q)))}function render(){const all=permits,rows=filtered();document.getElementById('summary').innerHTML=`<div class="metric"><small>Menunggu Keputusan</small><b>${all.filter(p=>p.status==='MENUNGGU_PIMPINAN').length}</b><span>perlu segera direview</span></div><div class="metric"><small>Izin Aktif</small><b>${all.filter(p=>p.status==='DISETUJUI').length}</b><span>belum ditandai kembali</span></div><div class="metric"><small>Rujukan UKS</small><b>${all.filter(p=>p.sumberPengajuan==='UKS').length}</b><span>pengajuan medis</span></div><div class="metric"><small>Selesai</small><b>${all.filter(p=>p.status==='SELESAI').length}</b><span>santri telah kembali</span></div>`;document.getElementById('tbody').innerHTML=rows.length?rows.map(p=>`<tr><td><b>${dateId(p.diajukanPada||p.tanggalPengajuan)}</b><br><span class="meta">${esc(p.sumberPengajuan||'-')} • ${esc(p.pengaju||'-')}</span></td><td><b>${esc(p.namaSantri||'-')}</b><br><span class="meta">${esc(p.kelas||p.usrah||'-')}</span></td><td><b>${esc(p.jenisIzin||'-')}</b><br><span class="meta">${esc(p.tujuan||p.tujuanRujukan||'-')}</span></td><td>${dateId(p.tanggalMulai)}<br><span class="meta">Kembali: ${dateId(p.rencanaKembali||p.tanggalKembaliRencana)}</span></td><td><span class="badge ${badge(p.status)}">${esc((p.status||'MENUNGGU_PIMPINAN').replaceAll('_',' '))}</span></td><td><button class="btn" onclick="openReview('${p.id}')">Buka</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">Tidak ada data sesuai filter.</div></td></tr>'}window.openReview=async id=>{selected=permits.find(p=>p.id===id);if(!selected)return;try{const detailSnap=await get(ref(db,`cahaya_app/perizinan_santri/${id}`));if(detailSnap.exists())selected={id,...selected,...detailSnap.val()}}catch(e){console.warn('Detail izin belum dapat dimuat:',e)}const p=selected;document.getElementById('modalTitle').textContent=`${p.namaSantri} • ${p.jenisIzin}`;document.getElementById('modalBody').innerHTML=`<div class="notice"><b>Status:</b> ${esc((p.status||'').replaceAll('_',' '))} • Diajukan oleh ${esc(p.sumberPengajuan||'-')}</div><div class="form-grid"><div class="card"><h3>Keperluan</h3><div class="detail"><div><b>Alasan:</b> ${esc(p.alasan||p.asesmenUKS||'-')}</div><div><b>Tujuan:</b> ${esc(p.tujuan||p.tujuanRujukan||'-')}</div><div><b>Mulai:</b> ${dateId(p.tanggalMulai||p.tanggalPengajuan)}</div><div><b>Rencana kembali:</b> ${dateId(p.rencanaKembali||p.tanggalKembaliRencana)}</div></div></div><div class="card"><h3>Penjemput / Pendamping</h3><div class="detail"><div><b>Nama:</b> ${esc(p.namaPenjemput||p.pendamping||'-')}</div><div><b>Hubungan:</b> ${esc(p.hubunganPenjemput||'-')}</div><div><b>Telepon:</b> ${esc(p.teleponPenjemput||'-')}</div></div></div><div class="card"><h3>Dokumen</h3><div class="detail">${p.suratDokter?.dataUrl?'<button class="btn" id="openDoc">Buka Surat Dokter</button>':'Tidak ada dokumen dokter.'}</div></div><div class="card"><h3>Catatan Keputusan</h3><div class="detail"><div><b>Oleh:</b> ${esc(p.disetujuiOleh||p.ditolakOleh||'-')}</div><div><b>Catatan:</b> ${esc(p.catatanPimpinan||p.alasanPenolakan||'-')}</div></div></div></div>${p.status==='MENUNGGU_PIMPINAN'?`<div class="form-group" style="margin-top:12px"><label>Catatan Pimpinan</label><textarea class="form-control" id="decisionNote" placeholder="Syarat penjemputan, waktu kembali, atau alasan penolakan."></textarea></div><div class="toolbar"><button class="btn green" id="approveBtn">✓ Setujui</button><button class="btn red" id="rejectBtn">✕ Tolak</button></div>`:''}${p.status==='DISETUJUI'?'<div class="toolbar"><button class="btn primary" id="returnBtn">✓ Tandai Santri Sudah Kembali</button></div>':''}`;if(p.suratDokter?.dataUrl)document.getElementById('openDoc').onclick=()=>window.open(p.suratDokter.dataUrl,'_blank');if(p.status==='MENUNGGU_PIMPINAN'){document.getElementById('approveBtn').onclick=()=>decide('DISETUJUI');document.getElementById('rejectBtn').onclick=()=>decide('DITOLAK')}if(p.status==='DISETUJUI')document.getElementById('returnBtn').onclick=markReturned;document.getElementById('modal').classList.add('open')};async function decide(status){const note=document.getElementById('decisionNote').value.trim();if(status==='DITOLAK'&&!note){alert('Tuliskan alasan penolakan.');return}const now=new Date().toISOString(),history=Array.isArray(selected.riwayatStatus)?selected.riwayatStatus:[];const data={status,waktuKeputusan:now,catatanPimpinan:note,riwayatStatus:[...history,{status,waktu:now,oleh:userName(),catatan:note}]};if(status==='DISETUJUI')data.disetujuiOleh=userName();else{data.ditolakOleh=userName();data.alasanPenolakan=note}const waliKey=String(selected.namaSantriKey||selected.namaSantri||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');const updates={};Object.entries(data).forEach(([k,v])=>{updates[`cahaya_app/perizinan_santri/${selected.id}/${k}`]=v;updates[`cahaya_app/perizinan_ringkas/${selected.id}/${k}`]=v;if(waliKey)updates[`cahaya_app/wali_index/${waliKey}/perizinan/${selected.id}/${k}`]=v});await update(ref(db),updates);closeModal();await loadData()}async function markReturned(){const now=new Date().toISOString(),history=Array.isArray(selected.riwayatStatus)?selected.riwayatStatus:[];const data={status:'SELESAI',waktuKembaliAktual:now,ditandaiKembaliOleh:userName(),riwayatStatus:[...history,{status:'SELESAI',waktu:now,oleh:userName(),catatan:'Santri telah kembali ke pesantren.'}]};const waliKey=String(selected.namaSantriKey||selected.namaSantri||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');const updates={};Object.entries(data).forEach(([k,v])=>{updates[`cahaya_app/perizinan_santri/${selected.id}/${k}`]=v;updates[`cahaya_app/perizinan_ringkas/${selected.id}/${k}`]=v;if(waliKey)updates[`cahaya_app/wali_index/${waliKey}/perizinan/${selected.id}/${k}`]=v});await update(ref(db),updates);closeModal();await loadData()}window.closeModal=()=>document.getElementById('modal').classList.remove('open');async function loadData(){let s=await get(query(ref(db,'cahaya_app/perizinan_ringkas'),orderByChild('tanggalPengajuan'),limitToLast(1000)));if(!s.exists())s=await get(query(ref(db,'cahaya_app/perizinan_santri'),orderByChild('tanggalPengajuan'),limitToLast(500)));permits=Object.entries(s.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>String(b.diajukanPada||b.tanggalPengajuan||'').localeCompare(String(a.diajukanPada||a.tanggalPengajuan||'')));render()}window.loadData=loadData;loadData().catch(e=>{console.error(e);document.getElementById('tbody').innerHTML='<tr><td colspan="6"><div class="empty">Data perizinan gagal dimuat.</div></td></tr>'});</script></body></html>
