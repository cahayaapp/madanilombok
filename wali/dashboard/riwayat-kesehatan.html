<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Pemeriksaan Kesehatan</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17243b;--muted:#718096;--line:#e4eaf2;--blue:#3478e5;--cyan:#0ea5c6;--green:#16a56a;--amber:#f3a51f;--red:#e84b5e;--violet:#8358dc;--shadow:0 14px 38px rgba(27,51,90,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f4f8ff,#fbf7ff 48%,#f3fbf8);color:var(--ink);font-family:Nunito,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:18px}.hero{padding:23px;border-radius:26px;background:linear-gradient(120deg,#173761,#2c69ba 48%,#15a2b8);color:#fff;box-shadow:0 18px 48px rgba(33,92,159,.22);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-170px;background:rgba(255,255,255,.11)}.hero h1{position:relative;margin:0;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.04em}.hero p{position:relative;margin:7px 0 0;color:#dcecff;font-size:.82rem;font-weight:700;line-height:1.55}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.field,.filter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;color:#405774;font-size:.74rem;font-weight:800;outline:0}.btn{border:0;border-radius:12px;padding:10px 14px;font-size:.72rem;font-weight:900;cursor:pointer;background:#eaf1fb;color:#356394}.btn.primary{background:linear-gradient(135deg,#2f72da,#24a0c0);color:#fff}.btn.green{background:#16a56a;color:#fff}.btn.red{background:#e84b5e;color:#fff}.btn.amber{background:#f3a51f;color:#fff}.btn:disabled{opacity:.55;cursor:wait}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.metric small{display:block;color:#8492a6;font-size:.58rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.metric b{display:block;margin-top:6px;font-size:1.25rem}.metric span{display:block;margin-top:3px;color:#7c8ba0;font-size:.62rem;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;font-size:.91rem}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:.66rem;font-weight:700}.panel-body{padding:15px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,#fff,#fbfdff)}.card-head{display:flex;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:.79rem}.meta{color:#7d8da3;font-size:.61rem;font-weight:750;line-height:1.55}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:.53rem;font-weight:950;background:#eef4fb;color:#53708e}.badge.wait{background:#fff5db;color:#a56c00}.badge.ok{background:#e9f9f1;color:#168456}.badge.no{background:#fff0f2;color:#c93d50}.badge.done{background:#eeeaff;color:#6a4bc0}.detail{margin-top:10px;padding-top:10px;border-top:1px dashed #dfe6ef;display:grid;gap:5px;font-size:.64rem;color:#465d79;line-height:1.55}.detail b{color:#263d5a}.empty{text-align:center;padding:34px 15px;color:#8090a5;font-size:.72rem;font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:.62rem;font-weight:950;color:#465d78}.form-control{width:100%;border:1px solid #dce4ee;border-radius:12px;padding:11px 12px;background:#fbfdff;color:#263d58;font-size:.72rem;font-weight:750;outline:0}.form-control:focus{border-color:#69a6ed;box-shadow:0 0 0 3px rgba(65,132,224,.12)}textarea.form-control{min-height:96px;resize:vertical}.notice{padding:11px 12px;border-radius:12px;background:#eff7ff;color:#3e638a;font-size:.65rem;font-weight:750;line-height:1.55;margin-bottom:12px}.notice.warn{background:#fff7df;color:#8d650c}.file-preview{display:none;margin-top:8px;border-radius:12px;max-width:220px;max-height:180px;object-fit:cover;border:1px solid var(--line)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{padding:11px 10px;text-align:left;background:#f2f6fb;color:#62748b;font-size:.55rem;text-transform:uppercase;letter-spacing:.04em}.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;font-size:.62rem;color:#405772;vertical-align:top}.table td b{color:#243b57}.modal{display:none;position:fixed;inset:0;z-index:9999;padding:18px;background:rgba(13,26,47,.58);align-items:center;justify-content:center}.modal.open{display:flex}.modal-card{width:min(780px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:.86rem}.modal-body{padding:15px}.close{width:34px;height:34px;border:0;border-radius:10px;background:#edf2f8;color:#5b6d83;font-weight:950}.doc-view{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}.loading{padding:30px;text-align:center;color:#74869d;font-size:.72rem;font-weight:850}@media(max-width:780px){.app{padding:10px}.summary{grid-template-columns:repeat(2,1fr)}.cards,.form-grid{grid-template-columns:1fr}.hero{padding:18px}.panel-body{padding:12px}}</style>  <script src="../../js/cahaya-bandwidth.js"></script>
</head><body><main class="app"><section class="hero"><h1>🩺 Riwayat Pemeriksaan Kesehatan</h1><p>Ringkasan pemeriksaan UKS ananda, hasil asesmen, pelayanan, obat, disposisi, dan tindak lanjut.</p></section><div class="toolbar"><input class="field" type="month" id="monthFilter"><button class="btn primary" onclick="loadData()">↻ Segarkan</button><span class="meta" id="studentLabel">Memuat identitas santri...</span></div><section class="summary" id="summary"></section><section class="panel"><header class="panel-head"><div><h2>Riwayat Pemeriksaan</h2><p>Klik kartu untuk membaca hasil pemeriksaan secara lengkap.</p></div></header><div class="panel-body"><div class="cards" id="cards"><div class="loading">Mengambil data UKS...</div></div></div></section></main><div class="modal" id="modal"><article class="modal-card"><header class="modal-head"><h3 id="modalTitle">Detail Pemeriksaan</h3><button class="close" onclick="closeModal()">×</button></header><div class="modal-body" id="modalBody"></div></article></div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>
    const firebaseConfig = window.CAHAYA_CONFIG.firebase;

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();let profile={},records=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');const vals=o=>o&&typeof o==='object'?Object.values(o):[];function readProfile(){try{return JSON.parse(localStorage.getItem('cahayaWaliStudentProfile')||'{}')}catch(e){return {}}}function studentName(){return profile.namaAnak||profile.namaSantri||profile.label||''}function dateId(v){if(!v)return '-';const d=new Date(v+'T00:00:00');return isNaN(d)?v:new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(d)}function statusClass(v){return /tidak mengikuti|dirujuk|dijemput/i.test(v)?'no':/kembali|boleh mengikuti/i.test(v)?'ok':'wait'}function medicineText(r){const m=r.asesmenDanPelayanan?.obatDiberikan||[];return m.length?m.map(x=>`${x.nama||x.namaObat||'Obat'} ${x.jumlah||''} ${x.satuan||''}`).join(', '):'Tidak ada obat tercatat'}function filtered(){const month=document.getElementById('monthFilter').value;return records.filter(r=>!month||String(r.tanggalPemeriksaan||'').startsWith(month))}function render(){const rows=filtered();const referrals=rows.filter(r=>/Dirujuk|Dijemput/i.test(r.disposisi?.keputusan||''));const permissions=rows.filter(r=>r.izinPembelajaran?.bolehTidakMengikutiPembelajaranHariIni);const meds=rows.filter(r=>(r.asesmenDanPelayanan?.obatDiberikan||[]).length);document.getElementById('summary').innerHTML=`<div class="metric"><small>Total Pemeriksaan</small><b>${rows.length}</b><span>pada periode dipilih</span></div><div class="metric"><small>Izin Tidak Belajar</small><b>${permissions.length}</b><span>berdasarkan pemeriksaan UKS</span></div><div class="metric"><small>Rujukan / Dijemput</small><b>${referrals.length}</b><span>memerlukan perhatian keluarga</span></div><div class="metric"><small>Menerima Obat</small><b>${meds.length}</b><span>pelayanan obat tercatat</span></div>`;document.getElementById('cards').innerHTML=rows.length?rows.map((r,i)=>`<article class="card"><div class="card-head"><div><h3>${esc(r.anamnesis?.keluhanUtama||'Pemeriksaan kesehatan')}</h3><div class="meta">${dateId(r.tanggalPemeriksaan)} • ${esc(r.waktuPemeriksaan||'')} • ${esc(r.petugasPemeriksa||'Petugas UKS')}</div></div><span class="badge ${statusClass(r.disposisi?.keputusan||r.statusPembelajaran)}">${esc(r.disposisi?.keputusan||r.statusPembelajaran||'Diperiksa')}</span></div><div class="detail"><div><b>Hasil:</b> ${esc(r.asesmenDanPelayanan?.asesmen||'-')}</div><div><b>Tindakan:</b> ${esc(r.asesmenDanPelayanan?.tindakan||'-')}</div><div><b>Obat:</b> ${esc(medicineText(r))}</div></div><button class="btn" style="margin-top:10px" onclick="openDetail(${i})">Buka Detail</button></article>`).join(''):'<div class="empty">Belum ada pemeriksaan UKS pada periode ini.</div>'}window.openDetail=i=>{const r=filtered()[i];if(!r)return;document.getElementById('modalTitle').textContent=`Pemeriksaan ${dateId(r.tanggalPemeriksaan)}`;const vital=r.tandaVital||{};document.getElementById('modalBody').innerHTML=`<div class="notice"><b>Keluhan utama:</b> ${esc(r.anamnesis?.keluhanUtama||'-')}</div><div class="form-grid"><div class="card"><h3>Hasil Pemeriksaan</h3><div class="detail"><div><b>Asesmen:</b> ${esc(r.asesmenDanPelayanan?.asesmen||'-')}</div><div><b>Kondisi umum:</b> ${esc(vital.kondisiUmum||'-')}</div><div><b>Suhu:</b> ${esc(vital.suhuC??'-')} °C</div><div><b>Tekanan darah:</b> ${esc(vital.tekananDarah||'-')}</div><div><b>SpO₂:</b> ${esc(vital.spo2Persen??'-')}%</div><div><b>Skala nyeri:</b> ${esc(vital.skalaNyeri??'-')}</div></div></div><div class="card"><h3>Pelayanan & Disposisi</h3><div class="detail"><div><b>Tindakan:</b> ${esc(r.asesmenDanPelayanan?.tindakan||'-')}</div><div><b>Obat:</b> ${esc(medicineText(r))}</div><div><b>Keputusan:</b> ${esc(r.disposisi?.keputusan||'-')}</div><div><b>Tujuan rujukan:</b> ${esc(r.disposisi?.tujuanRujukan||'-')}</div><div><b>Pendamping:</b> ${esc(r.disposisi?.pendamping||'-')}</div></div></div><div class="card"><h3>Izin Belajar</h3><div class="detail"><div><b>Status:</b> ${r.izinPembelajaran?.bolehTidakMengikutiPembelajaranHariIni?'Izin tidak mengikuti pembelajaran':'Boleh mengikuti pembelajaran'}</div><div><b>Waktu:</b> ${esc(r.izinPembelajaran?.mulaiPukul||'-')}–${esc(r.izinPembelajaran?.sampaiPukul||'-')}</div><div><b>Lokasi istirahat:</b> ${esc(r.izinPembelajaran?.lokasiIstirahat||'-')}</div><div><b>Keterangan:</b> ${esc(r.izinPembelajaran?.keteranganUntukGuru||'-')}</div></div></div><div class="card"><h3>Tindak Lanjut</h3><div class="detail"><div><b>Edukasi:</b> ${esc(r.asesmenDanPelayanan?.edukasi||'-')}</div><div><b>Rencana:</b> ${esc(r.asesmenDanPelayanan?.rencanaTindakLanjut||'-')}</div><div><b>Tanda bahaya:</b> ${esc((r.skriningTandaBahaya?.daftar||[]).join(', ')||'Tidak ditemukan')}</div></div></div></div>`;document.getElementById('modal').classList.add('open')};window.closeModal=()=>document.getElementById('modal').classList.remove('open');async function loadData(){profile=readProfile();const name=studentName();document.getElementById('studentLabel').textContent=name?`Ananda: ${name}`:'Identitas santri belum terbaca';const month=document.getElementById('monthFilter').value||new Date().toISOString().slice(0,7);const start=`${month}-01`;const end=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();const finish=`${month}-${String(end).padStart(2,'0')}`;const waliKey=norm(name);let snap=await db.ref(`cahaya_app/wali_index/${waliKey}/kesehatan`).orderByChild('tanggalPemeriksaan').startAt(start).endAt(finish).limitToLast(300).once('value');if(!snap.exists())snap=window.CahayaBandwidth?await window.CahayaBandwidth.readCompat(db,'cahaya_app/pemeriksaan_kesehatan',{dateField:'tanggalPemeriksaan',start,end:finish,limit:300,ttl:2*60000}):await db.ref('cahaya_app/pemeriksaan_kesehatan').orderByChild('tanggalPemeriksaan').startAt(start).endAt(finish).limitToLast(300).once('value');records=vals(snap.val()).filter(r=>norm(r.identitasSantri?.namaSantri||r.namaSantri)===norm(name)).sort((a,b)=>String(b.waktuSimpan||b.tanggalPemeriksaan).localeCompare(String(a.waktuSimpan||a.tanggalPemeriksaan)));render()}window.addEventListener('message',e=>{if(e.data?.type==='CAHAYA_PROFILE_SYNC'){profile=e.data.profile||{};loadData()}});document.getElementById('monthFilter').value=new Date().toISOString().slice(0,7);document.getElementById('monthFilter').addEventListener('change',loadData);loadData().catch(e=>{console.error(e);document.getElementById('cards').innerHTML='<div class="empty">Data UKS gagal dimuat. Periksa koneksi dan hak akses Firebase.</div>'});</script></body></html>
